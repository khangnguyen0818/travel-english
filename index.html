<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TravelTalk – Tiếng Anh Du Lịch</title>
  <meta name="description" content="Học tiếng Anh du lịch cho người lớn: hội thoại, phát âm, chấm điểm giọng nói, từ vựng có hình ảnh.">
  <meta name="theme-color" content="#0b6bcb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TravelTalk">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Quay lại" hidden>←</button>
    <h1 id="pageTitle">TravelTalk</h1>
    <a class="icon-btn" href="#/survival" aria-label="Câu cứu nguy" title="Câu cứu nguy">🆘</a>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Điều hướng chính">
    <a href="#/" data-tab="home"><span>🏠</span>Trang chủ</a>
    <a href="#/learn" data-tab="learn"><span>💬</span>Học</a>
    <a href="#/vocab" data-tab="vocab"><span>🖼️</span>Từ vựng</a>
    <a href="#/speak" data-tab="speak"><span>🎙️</span>Luyện nói</a>
    <a href="#/me" data-tab="me"><span>👤</span>Cá nhân</a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-body" role="dialog" aria-modal="true">
      <button class="sheet-close" data-close aria-label="Đóng">✕</button>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div id="showNative" class="show-native" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
